[package]
name = "cilindros"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plugin do lxpanel: cilindros com líquido mostrando CPU, GPU, memória, disco e rede"
readme = "README.md"
keywords = ["lxpanel", "lxde", "monitor", "gtk", "plugin"]
categories = ["gui"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gtk = "0.19"
pangocairo = "0.22"

[dev-dependencies]
cairo-rs = { version = "0.22", features = ["png"] }

[lints]
workspace = true
