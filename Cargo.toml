[workspace]
members = ["cilindros"]
resolver = "3"

[workspace.package]
edition = "2024"
# A gtk-rs 0.19/0.22 exige Rust 1.92.
rust-version = "1.92"
license = "GPL-2.0-or-later"
repository = "https://github.com/1155dosilicon/lxapplets"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Perfis só valem na raiz do workspace (o cargo ignora os dos membros).
[profile.release]
# opt-level 3 já é o padrão do release.
lto = "fat"
codegen-units = 1
strip = "symbols"
# NÃO usar panic = "abort": os callbacks FFI dos plugins dependem de
# catch_unwind para que um pânico não derrube o lxpanel inteiro.
panic = "unwind"
